# Workspace configuration only — this is not a Gleam package.
# Publishable packages live under packages/; runnable examples under examples/.
# Managed by trellis: https://trellis.tylerbutler.com

[tools.trellis]
# examples/ also holds a pnpm workspace (node_modules, package.json);
# glob matches without a gleam.toml are skipped by trellis.
members = ["packages/*", "examples/**"]

[tools.trellis.exclude]
"@release" = ["examples/**"]
lint = ["examples/**"]
docs = ["examples/**"]
# Examples excluded from `trellis run test`: example_helper has no test/
# directory (gleam test fails when the <package>_test module is missing), and
# chatroom/cursor have tests that are not wired into the workspace run yet.
# collab_document, its client, and showcase run here.
test = [
  "examples/chatrooms",
  "examples/cursors",
  "examples/example_helpers",
]

# Tag individual package versions in addition to repository series tags,
# but not package level series tags. The repository_tag_* keys publish a
# moving series tag for the whole repo, anchored to beryl's version.
[tools.trellis.publish]
package_tags = ["exact"]
repository_tag_package = "beryl"
repository_tag_format = "v{series}"
repository_tags = ["minor"]

[tools.trellis.publish.lifecycle]
default = "git_only"

[tools.trellis.tasks.lint]
command = "gleam run -m glinter"
needs_deps = true

[tools.trellis.tasks.audit-licences]
command = "mise exec -- licence_audit"

[tools.trellis.tasks.audit-vulns]
command = "mise exec -- licence_audit vulns"

[tools.trellis.tasks.audit-check]
command = "mise exec -- licence_audit check --vulns"

[tools.trellis.changelog]
strictness = "warn"
kinds = [
  # `Initial Release` is a strict major bump: it plans 1.0.0 even for an
  # unreleased 0.x package. Pre-1.0 packages use `Added` for their first
  # release and describe that initial release in the fragment body.
  { label = "Initial Release", bump = "major" },
  { label = "Added", bump = "minor" },
  { label = "Changed", bump = "minor" },
  { label = "Fixed", bump = "patch" },
  { label = "Performance", bump = "patch" },
  { label = "Removed", bump = "minor" },
  { label = "Deprecated", bump = "patch" },
  { label = "Security", bump = "patch" },
  { label = "Dependencies", bump = "patch" },
]
