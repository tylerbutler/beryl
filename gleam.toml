# Workspace configuration only — this is not a Gleam package.
# Publishable packages live under packages/; runnable examples under examples/.
# Managed by trellis: https://trellis.tylerbutler.com

[tools.trellis]
# examples/ also holds a pnpm workspace (node_modules, package.json);
# glob matches without a gleam.toml are skipped by trellis.
# NOTE: can't use "examples/**" here — a `**` in members recurses into each
# example's build/packages/* vendored deps and errors on duplicate members.
# See https://github.com/tylerbutler/trellis/issues/21. Enumerate single-level
# globs plus the nested client instead. (`**` is fine in exclude keys below.)
members = ["packages/*", "examples/*", "examples/collab_docs/client"]

[tools.trellis.exclude]
# beryl_ewe is not yet ready to publish; the reserved "@release" key keeps it
# built/tested/linted while excluding it from changelog, versioning, tagging,
# publishing, and release CI.
"@release" = ["examples/**", "packages/beryl_ewe"]
lint = ["examples/**"]
docs = ["examples/**"]
# Examples excluded from `trellis run test`: example_helpers has no test/
# directory (gleam test fails when the <package>_test module is missing), and
# chatrooms/cursors have tests that are not wired into the workspace run yet.
# collab_docs, its client, and showcase run here.
test = [
  "examples/chatrooms",
  "examples/cursors",
  "examples/example_helpers",
]

[tools.trellis.tasks.lint]
command = "gleam run -m glinter"
needs-deps = true

[tools.trellis.publish]
tag-format = "{name}-v{version}"

[tools.trellis.changelog]
kinds = [
  { label = "Initial Release", bump = "major" },
  { label = "Added", bump = "minor" },
  { label = "Changed", bump = "minor" },
  { label = "Fixed", bump = "patch" },
  { label = "Performance", bump = "patch" },
  { label = "Removed", bump = "minor" },
  { label = "Deprecated", bump = "patch" },
  { label = "Security", bump = "patch" },
  { label = "Dependencies", bump = "patch" },
]
