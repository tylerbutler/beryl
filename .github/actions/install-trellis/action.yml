name: Install trellis
description: >
  Install a pinned trellis release (https://trellis.tylerbutler.com) and add
  it to GITHUB_PATH.

inputs:
  version:
    description: trellis release tag to install
    # Requires >= 0.4.1 for the lowercase `release:` PR title
    # (tylerbutler/trellis#17); >= 0.3.0 added git-dependency parsing and
    # glob member skipping (tylerbutler/trellis#9).
    default: v0.4.1

runs:
  using: composite
  steps:
    - name: Install trellis
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/tylerbutler/trellis/releases/download/${{ inputs.version }}/trellis-gleam-installer.sh" | sh
        trellis --version
