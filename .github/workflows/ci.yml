name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_API_KEY }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changed paths
    outputs:
      source: ${{ steps.filter.outputs.source }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      load: ${{ steps.filter.outputs.load }}
      relevant: >-
        ${{
          steps.filter.outputs.source == 'true' ||
          steps.filter.outputs.docs == 'true' ||
          steps.filter.outputs.examples == 'true' ||
          steps.filter.outputs.load == 'true'
        }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # ratchet:dorny/paths-filter@v3
        with:
          filters: |
            source:
              - 'packages/**'
              - '**/gleam.toml'
              - '**/manifest.toml'
              - '.mise.toml'
              - '.tool-versions'
              - 'justfile'
            docs:
              - 'packages/**'
              - 'website/**'
              - '**/gleam.toml'
              - '**/manifest.toml'
              - '.mise.toml'
              - '.tool-versions'
              - 'justfile'
            examples:
              - 'examples/**'
              - 'packages/**'
              - '**/gleam.toml'
              - '**/manifest.toml'
              - '.mise.toml'
              - '.tool-versions'
              - 'justfile'
            load:
              - 'load/**'
              - 'examples/load_test/**'
              - 'packages/**'
              - '**/gleam.toml'
              - '**/manifest.toml'
              - '.mise.toml'
              - '.tool-versions'
              - 'justfile'

  dependencies:
    needs: changes
    runs-on: ubuntu-latest
    name: Dependencies
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.relevant == 'true'

      - name: Setup environment
        if: needs.changes.outputs.relevant == 'true'
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          run-deps: false

      - name: Setup mise tools
        if: needs.changes.outputs.relevant == 'true'
        uses: ./.github/actions/mise

      # Cache source dependencies and resolution fingerprints, not compiled
      # output, so both Erlang versions can use the same cache.
      - name: Restore Gleam dependencies
        if: needs.changes.outputs.relevant == 'true'
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache/restore@v4
        with:
          path: |
            ~/.cache/gleam
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
          key: gleam-deps-${{ runner.os }}-${{ hashFiles('.tool-versions', '.mise.toml', '**/gleam.toml', '**/manifest.toml') }}
          restore-keys: |
            gleam-deps-${{ runner.os }}-

      - name: Install Gleam dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: just deps-gleam

      - name: Save Gleam dependencies
        if: >-
          ${{
            needs.changes.outputs.relevant == 'true' &&
            steps.cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache/save@v4
        with:
          path: |
            ~/.cache/gleam
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Skip dependency setup
        if: needs.changes.outputs.relevant != 'true'
        run: echo "No CI-relevant paths changed."

  test:
    needs: [changes, dependencies]
    runs-on: ubuntu-latest
    name: Test (Erlang ${{ matrix.erlang }})
    strategy:
      fail-fast: false
      matrix:
        erlang: ["27", "28"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.source == 'true'

      - name: Setup environment
        if: needs.changes.outputs.source == 'true'
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          # Providing erlang-version makes the action ignore version-file and
          # skip installing Gleam (gleam-version is left unset). Setup mise
          # tools (below) installs the Gleam pinned in .tool-versions, which
          # is what actually ends up on PATH and is what we want: one Gleam
          # version, matching local dev, regardless of the Erlang matrix leg.
          erlang-version: ${{ matrix.erlang }}
          run-deps: false

      - name: Setup mise tools
        if: needs.changes.outputs.source == 'true'
        uses: ./.github/actions/mise

      - name: Restore Gleam dependencies
        if: needs.changes.outputs.source == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache/restore@v4
        with:
          path: |
            ~/.cache/gleam
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Check formatting
        if: needs.changes.outputs.source == 'true'
        run: just format-check

      - name: Build (warnings as errors)
        if: needs.changes.outputs.source == 'true'
        run: just build-strict

      - name: Run tests
        if: needs.changes.outputs.source == 'true'
        run: just test

      - name: Skip source checks
        if: needs.changes.outputs.source != 'true'
        run: echo "No package source paths changed."

  docs:
    needs: [changes, dependencies]
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.docs == 'true'

      - name: Setup environment
        if: needs.changes.outputs.docs == 'true'
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          run-deps: false

      - name: Setup mise tools
        if: needs.changes.outputs.docs == 'true'
        uses: ./.github/actions/mise

      - name: Restore Gleam dependencies
        if: needs.changes.outputs.docs == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache/restore@v4
        with:
          path: |
            ~/.cache/gleam
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        if: needs.changes.outputs.docs == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # ratchet:pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Install website dependencies
        if: needs.changes.outputs.docs == 'true'
        run: pnpm -C website install --frozen-lockfile

      - name: Build documentation (Gleam docs + website reference)
        if: needs.changes.outputs.docs == 'true'
        run: just docs

      - name: Test reference docs generator
        if: needs.changes.outputs.docs == 'true'
        run: just site-reference-test

      - name: Type-check documentation snippets
        if: needs.changes.outputs.docs == 'true'
        run: pnpm -C website check:snippets

      - name: Validate reference docs are up to date
        if: needs.changes.outputs.docs == 'true'
        run: |
          just site-reference
          git diff --exit-code -- website/src/content/docs/reference/api \
            || { echo "::error::Generated reference docs are out of date. Run 'just site-reference' and commit the result."; exit 1; }

      - name: Install tutorial test browser
        if: needs.changes.outputs.docs == 'true'
        run: pnpm -C website exec playwright install --with-deps chromium

      - name: Check and build website and test tutorial demos
        if: needs.changes.outputs.docs == 'true'
        run: just site-demos-test

      - name: Skip documentation checks
        if: needs.changes.outputs.docs != 'true'
        run: echo "No documentation paths changed."

  examples:
    needs: [changes, dependencies]
    runs-on: ubuntu-latest
    name: Examples
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.examples == 'true'

      - name: Setup Node.js
        if: needs.changes.outputs.examples == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        if: needs.changes.outputs.examples == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # ratchet:pnpm/action-setup@v6
        with:
          package_json_file: examples/package.json

      - name: Setup environment
        if: needs.changes.outputs.examples == 'true'
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          run-deps: false

      - name: Setup mise tools
        if: needs.changes.outputs.examples == 'true'
        uses: ./.github/actions/mise

      - name: Restore Gleam dependencies
        if: needs.changes.outputs.examples == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache/restore@v4
        with:
          path: |
            ~/.cache/gleam
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install example dependencies
        if: needs.changes.outputs.examples == 'true'
        run: pnpm -C examples install --frozen-lockfile

      - name: Install Playwright browsers
        if: needs.changes.outputs.examples == 'true'
        run: pnpm -C examples exec playwright install --with-deps chromium

      - name: Build examples
        if: needs.changes.outputs.examples == 'true'
        run: just examples-build

      - name: Test examples
        if: needs.changes.outputs.examples == 'true'
        run: just examples-test

      - name: Skip example checks
        if: needs.changes.outputs.examples != 'true'
        run: echo "No example paths changed."

  load-smoke:
    needs: [changes, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Protocol smoke (Erlang ${{ matrix.erlang }}, ${{ matrix.transport }})
    strategy:
      fail-fast: false
      matrix:
        erlang: ["27", "28"]
        transport: [mist, ewe]
    env:
      PORT: "8000"
      SERVER_LOG: load/results/server-${{ matrix.erlang }}-${{ matrix.transport }}.log
      SUMMARY_PATH: load/results/protocol-smoke-${{ matrix.erlang }}-${{ matrix.transport }}.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.load == 'true'

      - name: Setup environment
        if: needs.changes.outputs.load == 'true'
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          # gleam-version intentionally omitted: Setup mise tools (below)
          # installs the Gleam pinned in .tool-versions, which is what
          # ends up on PATH. See the Test job for the full rationale.
          erlang-version: ${{ matrix.erlang }}
          run-deps: false

      - name: Setup Node.js
        if: needs.changes.outputs.load == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup mise tools
        if: needs.changes.outputs.load == 'true'
        uses: ./.github/actions/mise

      - name: Restore Gleam dependencies
        if: needs.changes.outputs.load == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache/restore@v4
        with:
          path: |
            ~/.cache/gleam
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Validate pinned k6 workload
        if: needs.changes.outputs.load == 'true'
        run: just load-check protocol-smoke

      - name: Build load-test server
        if: needs.changes.outputs.load == 'true'
        run: trellis run build load_test

      # protocol-smoke contains protocol/error thresholds only: this job does
      # not enforce latency, throughput, or other hardware-dependent gates.
      - name: Start server and run protocol correctness smoke
        if: needs.changes.outputs.load == 'true'
        shell: bash
        env:
          HTTP_TARGET_URL: http://127.0.0.1:8000/health
          GIT_SHA: ${{ github.sha }}
          RUNTIME: erlang-${{ matrix.erlang }}
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_GENERATOR: github-actions
        run: |
          mkdir -p load/results
          setsid bash -c '
            cd examples/load_test
            exec env PORT="$1" gleam run -m "$2"
          ' _ "$PORT" "load_test_${{ matrix.transport }}" >"$SERVER_LOG" 2>&1 &
          server_pid=$!
          cleanup() {
            if ! kill -0 -- "-$server_pid" 2>/dev/null; then
              wait "$server_pid" 2>/dev/null || true
              return
            fi

            kill -TERM -- "-$server_pid" 2>/dev/null || true
            for _ in {1..10}; do
              if ! kill -0 -- "-$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                return
              fi
              sleep 1
            done

            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:$PORT/health"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Load-test server exited before becoming healthy"
              sed -n '1,240p' "$SERVER_LOG"
              exit 1
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::Timed out waiting for the load-test server"
              sed -n '1,240p' "$SERVER_LOG"
              exit 1
            fi
            sleep 1
          done

          just load-run protocol-smoke \
            "ws://127.0.0.1:$PORT/socket" \
            "${{ matrix.transport }}"

      - name: Upload smoke diagnostics
        if: needs.changes.outputs.load == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: protocol-smoke-erlang-${{ matrix.erlang }}-${{ matrix.transport }}
          path: |
            ${{ env.SERVER_LOG }}
            ${{ env.SUMMARY_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: Skip load checks
        if: needs.changes.outputs.load != 'true'
        run: echo "No load-test paths changed."

  load-smoke-report:
    name: Protocol smoke report
    needs: load-smoke
    if: >-
      ${{
        always() &&
        needs.changes.outputs.load == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Download smoke artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-artifacts
          gh run download "$GITHUB_RUN_ID" \
            --pattern "protocol-smoke-*" \
            --dir smoke-artifacts || true

      - name: Render smoke report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node load/k6/render-smoke-comment.mjs smoke-artifacts "$RUN_URL" > smoke-comment.md

      - name: Update sticky PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # ratchet:marocchino/sticky-pull-request-comment@v3
        with:
          header: beryl-protocol-smoke
          path: smoke-comment.md
