name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (Erlang ${{ matrix.erlang }})
    strategy:
      fail-fast: false
      matrix:
        erlang: ["27", "28"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          # Providing erlang-version makes the action ignore version-file, so
          # gleam-version must be set explicitly or Gleam won't be installed.
          erlang-version: ${{ matrix.erlang }}
          gleam-version: "1.16.0"
          run-deps: false

      - name: Install rebar3
        uses: ./.github/actions/install-rebar3

      - name: Install trellis
        uses: ./.github/actions/install-trellis

      - name: Install Gleam dependencies
        run: just deps-gleam

      - name: Check formatting
        run: just format-check

      - name: Type check
        run: just check

      - name: Build (warnings as errors)
        run: just build-strict

      - name: Run tests
        run: just test

  docs:
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          run-deps: false

      - name: Install trellis
        uses: ./.github/actions/install-trellis

      - name: Install Gleam dependencies
        run: just deps-gleam

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # ratchet:pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Install website dependencies
        run: pnpm -C website install --frozen-lockfile

      - name: Build documentation (Gleam docs + website reference)
        run: just docs

      - name: Test reference docs generator
        run: just site-reference-test

      - name: Validate reference docs are up to date
        run: |
          just site-reference
          git diff --exit-code -- website/src/content/docs/reference/api \
            || { echo "::error::Generated reference docs are out of date. Run 'just site-reference' and commit the result."; exit 1; }

  examples:
    runs-on: ubuntu-latest
    name: Examples
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # ratchet:pnpm/action-setup@v6
        with:
          package_json_file: examples/package.json

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main

      - name: Install rebar3
        uses: ./.github/actions/install-rebar3

      - name: Install trellis
        uses: ./.github/actions/install-trellis

      - name: Install Playwright browsers
        run: pnpm -C examples exec playwright install --with-deps chromium

      - name: Build examples
        run: just examples-build

      - name: Test examples
        run: just examples-test
