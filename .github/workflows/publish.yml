name: Publish

# "Tags as record": triggered by merging the trellis release PR (branch
# release/pending); per-package tags and GitHub releases are created for
# every version bump. workflow_dispatch allows re-running manually — trellis
# tag create is idempotent (only creates tags that don't exist yet).
#
# Stable releases and candidates are GitHub-only. All released packages have
# the git_only lifecycle; do not add Hex publishing or a write API key here.
# Trellis marks candidate GitHub releases as prereleases and leaves moving
# series tags unchanged until promotion.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release/pending' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@ed7d5e5f1d4370a5ccf06503916e3c301102ab1c # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          erlang-version: "28"
          run-deps: false

      - name: Setup mise tools
        uses: ./.github/actions/mise

      - name: Tag and create GitHub releases
        run: trellis tag create --push --github-release
        env:
          GH_TOKEN: ${{ github.token }}
