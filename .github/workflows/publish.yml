name: Publish

# "Tags as record": triggered by merging the trellis release PR (branch
# release/pending); per-package tags and GitHub releases are created for
# every version bump. workflow_dispatch allows re-running manually — trellis
# tag create is idempotent (only creates tags that don't exist yet).
#
# Hex publishing is temporarily disabled (`trellis publish` is not run) while
# packages are not ready for a public Hex release. Tags and GitHub releases
# still record what would have shipped. To resume Hex publishing, re-add a
# "Publish to Hex.pm" step running `trellis publish --all-untagged` (with
# HEXPM_API_KEY) before the tag/release step.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release/pending')
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@77f80621309fc7443b628802e08a815d41dd4b47 # ratchet:tylerbutler/actions/setup-gleam@main

      - name: Setup mise tools
        uses: ./.github/actions/mise

      - name: Tag and create GitHub releases
        run: trellis tag create --push --github-release
        env:
          GH_TOKEN: ${{ github.token }}
