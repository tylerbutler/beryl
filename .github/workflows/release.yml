name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Prerelease label (e.g. rc), promotion (none), or automatic (empty)"
        type: string
        default: ""
      versions:
        description: "Optional package targets, e.g. beryl=1.0.0,beryl_mist=0.5.0"
        type: string
        default: ""

concurrency:
  group: trellis-release
  cancel-in-progress: false

env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_API_KEY }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup mise tools
        uses: ./.github/actions/mise

      # Toolchain needed to regenerate the website API reference after the
      # version bump (mirrors the Docs job in ci.yml).
      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@ed7d5e5f1d4370a5ccf06503916e3c301102ab1c # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          erlang-version: "28"
          run-deps: false
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore Gleam dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6
        with:
          path: |
            ~/.cache/gleam/hex/hexpm/packages
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
            scripts/fixtures/*/build/packages
            build/snippet-check/manifest.toml
            build/snippet-check/build/packages
          key: gleam-deps-v2-${{ runner.os }}-${{ hashFiles('.mise.toml', '**/gleam.toml', '**/manifest.toml', 'scripts/prepare-gleam-deps.mjs', 'website/scripts/check-snippets.mjs', '!**/build/**', '!**/node_modules/**') }}
          restore-keys: |
            gleam-deps-v2-${{ runner.os }}-

      - name: Clean stale Gleam dependency state
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          trellis run clean
          rm -rf build/snippet-check

      - name: Install Gleam dependencies
        run: just deps-gleam

      - name: Save Gleam dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6
        with:
          path: |
            ~/.cache/gleam/hex/hexpm/packages
            packages/*/build/packages
            examples/*/build/packages
            examples/*/client/build/packages
            scripts/fixtures/*/build/packages
            build/snippet-check/manifest.toml
            build/snippet-check/build/packages
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Install website dependencies
        run: pnpm -C website install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update release PR
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$INPUT_PRE" ]]; then
            args+=(--pre "$INPUT_PRE")
          fi
          if [[ -n "$INPUT_VERSIONS" ]]; then
            while IFS= read -r target; do
              args+=(--set "$target")
            done < <(printf '%s\n' "$INPUT_VERSIONS" | tr ',' '\n')
          fi
          node scripts/prepare-release.mjs "${args[@]}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PRE: ${{ inputs.pre }}
          INPUT_VERSIONS: ${{ inputs.versions }}
