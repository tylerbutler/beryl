name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  # PR title conventional commit validation
  title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  # Workspace invariants + changelog entry check
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise tools
        uses: ./.github/actions/mise

      - name: Check workspace invariants
        run: trellis doctor

      # The release PR (branch release/pending) consumes all unreleased
      # fragments into the CHANGELOGs, so it can never satisfy this check.
      - name: Check changelog fragments
        id: changelog
        if: github.head_ref != 'release/pending'
        # Keep going on a failed check so the comment below still reports why.
        continue-on-error: true
        run: |
          trellis changelog check \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --format github >> "$GITHUB_OUTPUT"

      # Sticky comment keyed on an HTML marker: one comment per PR, rewritten
      # on every push. `gh pr comment --edit-last` can't be used here — it
      # edits the newest github-actions[bot] comment whatever its content, so
      # it clobbers the protocol-smoke comment from ci.yml and both workflows
      # then keep re-creating each other's comments.
      - name: Comment changelog preview
        if: steps.changelog.outputs.preview != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW: ${{ steps.changelog.outputs.preview }}
        run: |
          marker="<!-- beryl-changelog-check -->"
          body="$marker
          $PREVIEW"
          comment_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
              | head -n 1
          )"
          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field body="$body"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field body="$body"
          fi

      - name: Fail on missing changelog fragments
        if: steps.changelog.outcome == 'failure'
        run: exit 1
