name = "beryl"
version = "0.2.0"
description = "Type-safe app-side real-time sockets and presence for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "beryl", path = "packages/beryl" }
gleam = ">= 1.13.0"
target = "erlang"
internal_modules = [
  "beryl/app_supervisor",
  "beryl/connection_limit",
  "beryl/internal",
  "beryl/log",
  "beryl/rate_limit",
  "beryl/telemetry",
  "beryl/runtime",
]

[dependencies]
palabres = ">= 1.0.4 and < 2.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
lattice_presence = ">= 1.0.0 and < 2.0.0"
telemetry = ">= 1.4.2 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
phoenix_channel_fixtures = { git = "https://github.com/tylerbutler/phoenix_channel_fixtures.git", ref = "7daccb856d17db6278980277237c201b2acdcdf1" }
glinter = ">= 2.19.0 and < 3.0.0"

[tools.licence_audit]
allow = ["Apache-2.0", "MIT"]
deny = []

[tools.glinter]
# Promote enabled-rule warnings to errors so any violation fails the lint.
# glinter 2.19.0 only fails the run via this global flag; per-rule "error" does
# not escalate severity for most rules (see glinter.gleam apply_config).
warnings_as_errors = true

[tools.glinter.rules]
# --- Enforced at error level (this work item, issues #102-#111) ---
thrown_away_error = "error"
discarded_result = "error"
unused_exports = "error"
deep_nesting = "error"
prefer_guard_clause = "error"
error_context_lost = "error"
unqualified_import = "error"
stringly_typed_error = "error"
short_variable_name = "error"
string_inspect = "error"
# --- Out-of-scope default-warning rules: disabled so warnings_as_errors only
#     gates the ten rules above (these carry pre-existing, out-of-scope findings) ---
assert_ok_pattern = "off"
echo = "off"
panic_without_message = "off"
todo_without_message = "off"
unnecessary_variable = "off"
redundant_case = "off"
trailing_underscore = "off"
unnecessary_string_concatenation = "off"
missing_type_annotation = "off"
label_possible = "off"
missing_labels = "off"
duplicate_import = "off"
