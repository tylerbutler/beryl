name = "beryl_channels"
version = "0.0.1"
description = "Composable channel layer for beryl real-time sockets"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "beryl", path = "packages/beryl_channels" }
gleam = ">= 1.13.0"
target = "erlang"
# Same as Gleam's default for this package name, declared explicitly so the
# router adapter stays out of the published package interface and the docs
# even if the default ever changes. `beryl_channels` and
# `beryl_channels/channel` are the only public modules.
internal_modules = [
  "beryl_channels/internal",
  "beryl_channels/internal/*",
]

[dependencies]
beryl = { path = "../beryl" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.19.0 and < 3.0.0"
# Wire-contract parity matrix only: the same scenarios are driven over a real
# WebSocket transport against `beryl.child_spec` and
# `beryl_channels.child_spec`.
beryl_mist = { path = "../beryl_mist" }
mist = ">= 6.0.0 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
phoenix_channel_fixtures = { git = "https://github.com/tylerbutler/phoenix_channel_fixtures.git", ref = "7daccb856d17db6278980277237c201b2acdcdf1" }
gluegun = { git = "https://github.com/tylerbutler/gluegun.git", ref = "532af1ac0308ff93c8a957467dbb638859593c93" }

[tools.licence_audit]
allow = ["Apache-2.0", "MIT"]
deny = []

[tools.glinter]
# Promote enabled-rule warnings to errors so any violation fails the lint.
warnings_as_errors = true

[tools.glinter.rules]
# --- Same rule set as packages/beryl ---
thrown_away_error = "error"
discarded_result = "error"
unused_exports = "error"
deep_nesting = "error"
prefer_guard_clause = "error"
error_context_lost = "error"
unqualified_import = "error"
stringly_typed_error = "error"
short_variable_name = "error"
string_inspect = "error"
assert_ok_pattern = "off"
echo = "off"
panic_without_message = "off"
todo_without_message = "off"
unnecessary_variable = "off"
redundant_case = "off"
trailing_underscore = "off"
unnecessary_string_concatenation = "off"
missing_type_annotation = "off"
label_possible = "off"
missing_labels = "off"
duplicate_import = "off"
