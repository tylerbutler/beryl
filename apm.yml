name: beryl
version: 1.0.0
description: APM project for beryl
author: Tyler Butler
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
- claude
- copilot

dependencies:
  lsp:
    - name: gleam
      command: gleam
      args: ["lsp"]
      extensionToLanguage:
        ".gleam": gleam

devDependencies:
  apm:
    - tylerbutler/apm-base
    - tylerbutler/agent-marketplace/plugins/gleam
  mcp: []
includes: auto
scripts: {}
