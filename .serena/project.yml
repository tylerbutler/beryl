# Serena project configuration.
# Option reference: https://oraios.github.io/serena/02-usage/050_configuration.html
# Keys left empty fall back to the global serena_config.yml.

project_name: "beryl"
languages:
- erlang
encoding: "utf-8"
language_backend:
ignore_all_files_in_gitignore: true
ignored_paths: []
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
base_modes:
default_modes:
initial_prompt: ""
symbol_info_budget:
added_modes:
line_ending:
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_specific_settings: {}
ls_workspace_folders:
- .
ls_additional_workspace_folders: []
activation_command:
activation_command_timeout: 180.0
