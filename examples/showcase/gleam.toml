name = "showcase"
version = "0.1.0"
description = "All three beryl examples behind a single landing page (Railway deploy target)"
gleam = ">= 1.7.0"
target = "erlang"

[dependencies]
beryl = { path = "../../packages/beryl" }
beryl_mist = { path = "../../packages/beryl_mist" }
example_helpers = { path = "../example_helpers" }
cursors = { path = "../cursors" }
chatrooms = { path = "../chatrooms" }
collab_docs = { path = "../collab_docs" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
mist = ">= 6.0.0 and < 7.0.0"
envoy = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
