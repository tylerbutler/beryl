name = "showcase"
version = "0.1.0"
description = "All three beryl examples behind a single landing page (Railway deploy target)"
gleam = ">= 1.7.0"
target = "erlang"

[erlang]
application_start_module = "showcase"

[dependencies]
beryl = { path = "../../packages/beryl" }
beryl_ewe = { path = "../../packages/beryl_ewe" }
example_helper = { path = "../example_helpers" }
cursor = { path = "../cursors" }
chatroom = { path = "../chatrooms" }
collab_document = { path = "../collab_docs" }
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 0.29.0 and < 2.0.0"
gleam_otp = ">= 0.12.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"
ewe = ">= 9.0.0 and < 10.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
relay_supervisor = ">= 1.0.0-rc1 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
unitest = ">= 1.6.1 and < 2.0.0"
