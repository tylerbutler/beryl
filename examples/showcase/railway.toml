# Railway service config for the showcase deployment that bundles cursors,
# chatrooms, and collab_docs behind a single landing page.
#
# Set the service's Root Directory to the *repository root* in the Railway UI
# (not examples/showcase), and point it at this config file. The Dockerfile
# needs the whole repo as build context because the showcase project depends
# on the local beryl package and the three example projects via relative
# paths.

[build]
builder = "DOCKERFILE"
dockerfilePath = "examples/showcase/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
