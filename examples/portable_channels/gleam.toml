name = "portable_channels"
version = "0.1.0"
description = "Roost and beryl_protocol channels in a Cloudflare Durable Object"
gleam = ">= 1.13.0"
target = "javascript"

[dependencies]
beryl_protocol = { path = "../../packages/beryl_protocol" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
roost = { git = "https://github.com/tylerbutler/roost.git", ref = "17a2db06b147c82a77fc76cbbc21fee6fe043c7e" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
phoenix_channel_fixtures = { git = "https://github.com/tylerbutler/phoenix_channel_fixtures.git", ref = "7daccb856d17db6278980277237c201b2acdcdf1" }
