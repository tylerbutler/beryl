name = "chatrooms"
version = "0.1.0"
description = "Multi-room chat demo for beryl"
gleam = ">= 1.4.0"
target = "erlang"

[dependencies]
beryl = { path = "../.." }
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 0.29.0 and < 2.0.0"
gleam_otp = ">= 0.12.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
wisp = { git = "https://github.com/tylerbutler/wisp.git", ref = "0bbfe7f" }
mist = ">= 5.0.0 and < 6.0.0"
exception = ">= 2.0.0 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
