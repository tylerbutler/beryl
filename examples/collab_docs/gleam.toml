name = "collab_document"
version = "0.1.0"
description = "Collaborative CRDT document blocks demo for beryl"
gleam = ">= 1.7.0"
target = "erlang"

[dependencies]
beryl = { path = "../../packages/beryl" }
beryl_mist = { path = "../../packages/beryl_mist" }
example_helper = { path = "../example_helpers" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
mist = ">= 6.0.0 and < 7.0.0"
lattice_core = ">= 1.0.0 and < 2.0.0"
lattice_maps = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lattice_registers = ">= 1.0.0 and < 2.0.0"
