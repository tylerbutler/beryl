name = "todo_client"
version = "1.0.0"
description = "A standalone browser Todo app built with Lustre"
gleam = ">= 1.13.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.build]
minify = true
outdir = "./priv/static"

[tools.lustre.dev]
port = 8011

[tools.lustre.html]
title = "Lustre Todo"
body = "<main id=\"app\"></main>"
stylesheets = [{ href = "/style.css" }]
