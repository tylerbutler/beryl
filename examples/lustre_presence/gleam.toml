name = "lustre_presence"
version = "0.1.0"
description = "Authenticated beryl server for the Lustre presence example"
gleam = ">= 1.16.0"
target = "erlang"

[dependencies]
beryl = { path = "../../packages/beryl" }
beryl_ewe = { path = "../../packages/beryl_ewe" }
example_helper = { path = "../example_helpers" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
ewe = ">= 9.0.0 and < 10.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
