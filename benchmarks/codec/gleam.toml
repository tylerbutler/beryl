name = "beryl_codec_bench"
version = "0.1.0"
description = "Opt-in Phoenix codec microbenchmarks for beryl"
gleam = ">= 1.15.4"
target = "erlang"

[dependencies]
beryl = { path = "../../packages/beryl" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
glychee = ">= 1.1.3 and < 2.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
unitest = ">= 1.6.1 and < 2.0.0"
