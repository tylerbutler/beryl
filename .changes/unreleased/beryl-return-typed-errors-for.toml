package = "beryl"
kind = "Changed"
body = "Return typed errors for failed presence CRDT clock lookups instead of timing out, and resume asynchronous socket mutations with one failed acknowledgement. Failed replacements keep existing entries. Runtime owners stay monitored after rejection so socket death releases reserved cleanup capacity, including parent-supervisor shutdown. Match track call errors as TrackRequestFailed(error) in PresenceTrackError, and handle TrackInvalidCrdtState and UpdateInvalidCrdtState."
