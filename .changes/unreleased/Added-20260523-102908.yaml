kind: Added
body: Examples — new `examples/showcase` Gleam project bundles the cursors, chatrooms, and collab_docs demos behind a landing page so they can be deployed together as a single Railway service. Mounts each example under `/cursors`, `/chat`, `/docs` with a shared `/socket/websocket` endpoint. Each example's router now takes a `base_path` field on its `Context` (defaults to `""`, so standalone `gleam run` is unchanged). The standalone `examples/cursors/railway.toml` is removed in favor of `examples/showcase/railway.toml".
