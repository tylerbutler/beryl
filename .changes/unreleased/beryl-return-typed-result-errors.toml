package = "beryl"
kind = "Changed"
body = "Return typed errors from group and PubSub operations instead of exiting callers. Handle Results from `group.list_groups` and PubSub startup, join/leave, broadcasts, and subscriber queries; match `GroupCallFailed` and `PubSubError`. PubSub broadcasts and queries return `Error(ScopeRecovering)` during local membership replay; broadcasts remain best-effort and are not buffered or replayed. The scoped broadcast wire format is unchanged."
