project = "beryl_channels"
kind = "Added"
body = "Routing and dispatch: each socket gets one router holding the ordered handler table, its live topics, and a per-socket monotonic join generation. A join takes the first matching pattern, so registration order is the routing rule; overlapping patterns are allowed on purpose while an exact duplicate pattern is rejected by deterministic two-phase validation before any process starts, and a join for a topic no handler matches is refused with the reason payload unmatched topic. Client messages, binary frames and typed server-side sends route to the channel that owns the topic; actions lower in order onto core beryl effects scoped to that channel's own topic; close applies its actions and then kicks the topic; termination runs exactly once per accepted join; and a send addressed to a superseded join generation is dropped before its payload is unsealed, so it can never reach a later join on the same topic."
