project = "beryl_channels"
kind = "Added"
body = "Routing and dispatch: the supervised beryl_channels.child_spec entry point gives each socket one router holding the ordered handler table, its live topics, and a per-socket monotonic join generation. A join takes the first matching pattern, so registration order is the routing rule; overlapping patterns are allowed while an exact duplicate is rejected by deterministic two-phase validation before anything is built, and an unmatched topic is refused explicitly. Client messages, binary frames and typed server-side sends route to the owning channel; actions lower in order onto topic-scoped core effects; close applies its actions then kicks the topic; termination runs exactly once per accepted join; and mail for a superseded generation is dropped before its payload is unsealed."
