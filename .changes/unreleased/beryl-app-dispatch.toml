project = "beryl"
kind = "Added"
body = "App-side dispatch API: `beryl.start_app(config, init, update)` with `beryl/event` (`Event`/`Next`/`Effect`, typed `Sender`/`notify`, `ConnectInfo`), per-topic-pattern rate limits via `with_topic_rate`, single-use reply refs with duplicate-outstanding rejection, and socket/channel/broadcast telemetry. The channel-module API is unchanged; both can run side by side."
