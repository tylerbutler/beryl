project = "beryl"
kind = "Changed"
body = "The runtime no longer blocks its actor on presence: PresenceTrack, PresenceUntrack, and the automatic cleanup when a topic closes are sent to the presence actor asynchronously and acknowledged once both the CRDT and the ETS read model have been updated. Only the socket whose effect list is waiting is held (its later inbound messages are queued and delivered in arrival order); every other socket, broadcast, heartbeat check, and shutdown keeps being served, so a slow on_diff callback or a busy presence actor can no longer stall the whole runtime. Re-tracking a key is now one atomic replace in a single actor turn -- one leave-plus-join diff, no observable moment where the key is absent -- instead of an untrack followed by a track; topic-close cleanup untracks every remaining ref in one batch with one aggregate leave diff instead of one call per key; and a track's diff, the runtime's ref bookkeeping, and the later leave all use the exact meta presence stored, phx_ref included. A mutation that is not acknowledged within the configured window (5 s by default, matching the previous blocking call) is logged and the socket resumed without reporting the mutation as successful; late acknowledgements are discarded safely. Public presence APIs (track, untrack, untrack_all, list, get_by_key, count) are unchanged, including their immediate read-after-write behaviour."
