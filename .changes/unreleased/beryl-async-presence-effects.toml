project = "beryl"
kind = "Changed"
body = "The runtime no longer blocks its actor on presence: PresenceTrack, PresenceUntrack, and topic-close cleanup are sent to the presence actor asynchronously and acknowledged once both the CRDT and ETS read model have been updated. Only the socket whose effect is waiting is held; every other socket, broadcast, heartbeat, and shutdown remain served, so a busy presence actor can no longer stall the runtime. Track diffs, runtime ref bookkeeping, and later leave operations all use the exact stored metadata including phx_ref. Re-tracking a key is one atomic replace—one leave-plus-join diff with no moment where the key is absent. Topic-close cleanup untracks remaining refs in one batch with one aggregate leave diff, and graceful shutdown cleanup is not logged as a failure. A PresenceTrack emitted by Closed during beryl.stop is dropped without disturbing the old entry, which the automatic close cleanup then untracks and publishes correctly. A mutation not acknowledged within the configured window (5 s by default) is logged and the socket resumed; late acknowledgements are compensated with precise untracks, and later tracks of the same session/topic/key supersede prior refs in the same actor turn. Public presence APIs remain unchanged, including immediate read-after-write behaviour."
