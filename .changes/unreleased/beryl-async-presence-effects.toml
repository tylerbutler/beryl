project = "beryl"
kind = "Changed"
body = "The runtime no longer blocks its actor on presence: PresenceTrack, PresenceUntrack, and topic-close cleanup are sent to the presence actor asynchronously and acknowledged once both the CRDT and ETS read model have been updated. Only the socket whose effect is waiting is held; every other socket, broadcast, heartbeat, and shutdown remain served, so a busy presence actor can no longer stall the runtime. Track diffs, runtime ref bookkeeping, and later leave operations all use the exact stored metadata including phx_ref. Re-tracking a runtime-owned key is one atomic replace—one leave-plus-join diff with no moment where the key is absent. Topic-close cleanup untracks remaining runtime refs in one batch with one aggregate leave diff, and graceful shutdown finalizes pending replacements and untracks so their leave diffs are still published before exact runtime-owned refs are swept. A PresenceTrack emitted by Closed during beryl.stop is dropped without disturbing the old entry, which the automatic close cleanup then untracks and publishes correctly. A mutation not acknowledged within the configured window (5 s by default) is logged and the socket resumed; late acknowledgements are compensated by exact local CRDT tag, and shutdown sweeps only runtime-owned refs, so a newer synchronous public track with the same session/topic/key remains intact. Public presence APIs remain unchanged, including independently owned refs and immediate read-after-write behaviour."
