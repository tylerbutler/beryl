package = "beryl"
kind = "Changed"
body = "The runtime no longer blocks on presence: track, untrack, and topic-close cleanup are dispatched to the presence actor asynchronously and acknowledged once both the CRDT and the ETS read model have been updated. Only the socket whose effect is waiting is held — every other socket, broadcast, heartbeat, and shutdown is still served, so a busy presence actor can no longer stall the runtime. Re-tracking an existing key is atomic (one leave-plus-join diff, with no moment where the key is absent), topic-close cleanup untracks in one batch with a single aggregate leave diff, and graceful shutdown publishes pending leave diffs before sweeping. A mutation not acknowledged within the configured window (5 s by default) is logged and its socket resumed. Public presence APIs are unchanged, including independently owned refs and immediate read-after-write behaviour."
