project = "beryl"
kind = "Removed"
body = "Removed the channel-module API entirely: beryl/channel, the legacy beryl/socket API, beryl/coordinator, and beryl/supervisor, along with RegisteredChannel, beryl.register, beryl.send_info, and the unsupervised beryl.start path. The Sender-based beryl/bridge remains available for app-side dispatch. Use supervised app-side dispatch through beryl.child_spec with init and update; app-side dispatch types live in beryl/socket."
