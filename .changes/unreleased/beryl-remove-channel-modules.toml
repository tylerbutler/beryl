package = "beryl"
kind = "Removed"
body = "BREAKING: removed the channel-module API entirely: beryl/channel, the legacy beryl/socket API, beryl/coordinator, and beryl/supervisor, along with RegisteredChannel, beryl.register, beryl.send_info, and the unsupervised beryl.start path (with beryl.StartError). Starting a socket runtime without supervision left a crash unrecoverable and every connected socket stranded, so applications use beryl.child_spec in their OTP supervision tree; beryl.stop remains available for graceful shutdown. Use supervised app-side dispatch with init and update — the dispatch types are in beryl/socket — and the Sender-based beryl/bridge is still available."
