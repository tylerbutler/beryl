project = "beryl"
kind = "Removed"
body = "Removed the channel-module API entirely: beryl/channel, beryl/socket, beryl/coordinator, beryl/bridge, and beryl/supervisor, along with RegisteredChannel, beryl.register, beryl.send_info, and the unsupervised beryl.start path. Use supervised app-side dispatch through beryl.child_spec with init and update; app-side dispatch types live in beryl/event."
