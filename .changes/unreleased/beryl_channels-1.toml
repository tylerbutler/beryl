project = "beryl_channels"
kind = "Added"
body = "Initial release of beryl_channels, a composable channel layer built entirely on beryl's public app-side dispatch API: register a list of channel handlers and the layer routes every socket event to the channel that owns its topic, with no hand-written message union and no hand-written router. beryl_channels.child_spec takes a beryl.Config and handler table and returns an ordinary beryl.Sockets handle plus a child specification for the application's supervision tree, so a channel system works with the beryl_mist and beryl_ewe transports, beryl.broadcast, and beryl.stop without restoring an unsupervised start path. validate_handlers checks a handler table without building anything, and ChildSpecError and HandlerError preserve nested beryl errors."
