package = "beryl_channels"
kind = "Added"
body = "Initial release. beryl_channels is a composable channel layer built on beryl's public app-side dispatch API: register a list of channel handlers and the layer routes each socket event to the channel that owns its topic, with no hand-written message union or router. beryl_channels.child_spec takes a beryl.Config and a handler table and returns an ordinary beryl.Sockets handle plus a child specification for the application's supervision tree, so a channel system works with the beryl_mist and beryl_ewe transports, beryl.broadcast, and beryl.stop. Channels are defined in beryl_channels/channel: a Handler pairs a topic pattern with a typed join callback and keeps its private state and server-side message type out of the shared types, so unrelated channels compose in one list, and channel.notify delivers typed server-side sends without erasing values to Dynamic. A join takes the first matching pattern, so registration order is the routing rule; overlapping patterns are allowed, exact duplicates are rejected by validation before anything is built, and unmatched topics are refused explicitly. Channels emit ordered topic-scoped actions (push, broadcast, broadcast_from, reply_ok, reply_error, presence track/untrack/push/broadcast), may attach accept-time actions with channel.with_actions that are lowered after the join acknowledgment, and may run channel.on_terminate actions once per accepted join on close. validate_handlers checks a handler table without building anything, and ChildSpecError and HandlerError preserve nested beryl errors."
