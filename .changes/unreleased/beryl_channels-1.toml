project = "beryl_channels"
kind = "Added"
body = "Initial release of beryl_channels, a composable channel layer built entirely on beryl's public app-side dispatch API: register a list of channel handlers and the layer routes every socket event to the channel that owns its topic, with no hand-written message union and no hand-written router. beryl_channels.start and beryl_channels.child_spec take a beryl.Config and a handler table and return an ordinary beryl.Sockets handle, so a channel system works with the beryl_mist and beryl_ewe transports, with beryl.broadcast and beryl.stop, and inside an application's own supervision tree. validate_handlers checks a handler table without starting anything, and the StartError, ChildSpecError and HandlerError types nest the underlying beryl error rather than flattening it."
