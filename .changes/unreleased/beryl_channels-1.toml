package = "beryl_channels"
kind = "Added"
body = "Initial release. beryl_channels is a composable channel layer built on beryl's public app-side dispatch API: register a list of channel handlers and the layer routes each socket event to the channel that owns its topic, with no hand-written message union or router. beryl_channels.child_spec takes a beryl.Config and a handler table and returns an ordinary beryl.Sockets handle plus a child specification for the application's supervision tree, so a channel system works with the beryl_mist and beryl_ewe transports, beryl.broadcast, and beryl.stop. Channels are defined in beryl_channels/channel: a Handler pairs a topic pattern with a typed join callback and keeps its private state and server-side message type out of the shared types, so unrelated channels compose in one list, and channel.notify delivers typed server-side sends without erasing values to Dynamic. A join takes the first matching pattern, so registration order is the routing rule; overlapping patterns are allowed, exact duplicates are rejected before anything is built, and unmatched topics are refused explicitly. JoinContext carries the matched topic, wildcard captures, payload, connection data, and typed sender; accept seals private state with reusable callbacks. Channel callbacks return ordered phase-typed action lists, with active-only pushes, replies, presence tracking, and presence pushes excluded from termination. child_spec reports InvalidPattern, DuplicatePattern, and InvalidConfig errors directly."
