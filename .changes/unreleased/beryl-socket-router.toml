project = "beryl"
kind = "Added"
body = "New beryl/socket/router module: topic-namespace routing for app-side dispatch. Namespaces are keyed on beryl/topic patterns (the same syntax as with_topic_rate) and handlers receive a Match carrying the values captured by the pattern's wildcards. Includes namespace, accept_only, and stateful constructors, fail-closed route dispatch, and the Standalone quick-start model. Stateful sub-models are committed only for accepted joins, and close handlers receive socket.StopReason. beryl/socket gains reply_ok, the ref-gated ok-reply helper."
