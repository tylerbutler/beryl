package = "beryl"
kind = "Added"
body = "presence.list, presence.get_by_key, and the new presence.count read a materialized per-topic ETS snapshot directly instead of calling the presence actor, so reads never block on the actor mailbox. The actor remains the sole writer and republishes each topic's snapshot atomically after every track, untrack, untrack_all, remote merge, and replica-pruning operation. Each snapshot stores its entry count alongside its entries, so presence.count is O(1)."
