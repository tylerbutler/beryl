body = "presence.list, get_by_key, and the new presence.count now read a materialized per-topic ETS snapshot directly instead of calling the presence actor, so reads never block on the actor mailbox; the actor remains the sole writer and republishes each topic's snapshot atomically after every track/untrack/untrack_all, remote merge, and replica-pruning operation."
