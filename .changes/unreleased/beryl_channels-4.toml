project = "beryl_channels"
kind = "Added"
body = "Lifecycle actions: channel.with_actions attaches ordered accept-time actions to a successful join, lowered immediately after the join acknowledgment in the same update turn, so a push cannot precede its own join reply and a check made during join cannot be split from the presence track that satisfies it. channel.on_terminate returns topic-scoped Actions lowered inside the closing turn after the instance is removed, so leave announcements and post-leave presence rosters stay in the channel that owns them: core drops pushes to the closing topic while broadcasts and presence track/untrack still reach the topic's remaining subscribers."
