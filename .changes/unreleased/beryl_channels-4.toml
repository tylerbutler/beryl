project = "beryl_channels"
kind = "Added"
body = "Lifecycle actions: a successful join carries ordered accept-time actions (channel.with_actions), lowered immediately after AcceptJoin in the same update turn so a push cannot precede its own join reply and a check plus the presence track that satisfies it cannot be split across turns; on_terminate now returns topic-scoped Actions, lowered inside the Closed turn after the instance is removed, so leave announcements and post-leave presence rosters stay in the layer (core drops pushes to the closing topic while broadcasts and presence track/untrack still apply)."
