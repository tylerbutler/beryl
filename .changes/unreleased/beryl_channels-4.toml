project = "beryl_channels"
kind = "Added"
body = "Lifecycle actions: a successful join carries ordered accept-time actions (channel.with_actions), lowered after AcceptJoin so a push cannot precede its own join reply; asynchronous core effects may park that socket, but later actions resume only after they complete. on_terminate now returns topic-scoped Actions, lowered from Closed after the instance is removed, so leave announcements and post-leave presence rosters stay in the layer (core drops pushes to the closing topic while broadcasts and presence track/untrack still apply)."
