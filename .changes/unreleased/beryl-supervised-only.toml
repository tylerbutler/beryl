project = "beryl"
kind = "Removed"
body = "`beryl.start` and `beryl.StartError` are no longer public. Starting a channel system without supervision left a runtime crash unrecoverable and every connected socket stranded, so the API no longer offers it as a choice. Applications build beryl with `beryl.child_spec` and add the returned child specification to their own OTP supervision tree. `beryl.stop` remains available for gracefully stopping an app-dispatch runtime."
