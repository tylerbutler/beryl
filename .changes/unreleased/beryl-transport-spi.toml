package = "beryl"
kind = "Changed"
body = "BREAKING: reshaped the transport SPI. Server-agnostic infrastructure moved into two new modules: beryl/transport/server (TransportConfig builders, the shared upgrade pipeline, connection lifecycle, atomic runtime admission, and size/rate/decode routing with text/binary telemetry) and beryl/transport/origin (OriginPolicy and version checks). beryl/transport no longer exports connection-limit, decode, rate-limiter, or logging helpers — server owns those internally — and connection_owner is replaced by runtime_pid, which returns Result(Pid, Nil) directly; ConnectionOwner is removed. Transports match Ok(pid)/Error(Nil), monitor that exact pid, and pass it to admit_socket, which atomically installs the socket, closer, codec, and ConnectSeed; unavailable, replaced, or failed runtimes reject admission and close the connection. with_heartbeat is now timeout-only."
