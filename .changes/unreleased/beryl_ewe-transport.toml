project = "beryl_ewe"
kind = "Added"
body = "Initial release: Ewe WebSocket transport for beryl. Single-listener handler composing channels with an HTTP fallback, socket-level on_connect authentication seeding typed assigns, Origin policies (same-origin by default, allow-list, or allow-all) mitigating cross-site WebSocket hijacking, Phoenix ?vsn negotiation at the handshake, and edge enforcement of frame-size limits, message rate limits, and per-IP/node-wide connection ceilings before any coordinator state is allocated. Mirrors the beryl_mist transport API on the Ewe web server."
