project = "beryl_channels"
kind = "Added"
body = "Channel composition surface (beryl_channels/channel): an opaque, non-generic Handler pairing a topic pattern with a typed join callback; JoinInfo carrying the socket id, the transport's ConnectSeed and this join's typed Sender; closure-sealed JoinedChannel and Callbacks that keep each channel's private state and server-side message type out of every shared type, so handlers that agree on nothing compose in one list; ordered current-topic Actions (push, broadcast, broadcast_from, reply_ok, reply_error, presence_track, presence_untrack, push_presence, broadcast_presence); join accept, accept_with and reject results; and continue, close and stop_socket callback results. Typed server-side sends stay typed end to end: channel.notify seals the value for the join that created the sender, delivering exactly one on_info call per send, so no value is erased to Dynamic and no unchecked coercion is involved."
