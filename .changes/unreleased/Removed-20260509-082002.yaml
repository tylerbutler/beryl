kind: Removed
body: Removed `beryl.push_to_socket/3`. It hardcoded the Phoenix wire format and bypassed the configured codec, silently producing malformed frames for non-Phoenix codecs. Use `channel.Push` from a `handle_in`/`handle_info` callback instead — that path goes through the codec.
