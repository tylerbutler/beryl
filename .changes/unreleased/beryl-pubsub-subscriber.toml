project = "beryl"
kind = "Changed"
body = "Removed the last unchecked identity coercion from PubSub delivery and decoupled the bridge from channels. PubSub now delivers broadcasts through a typed `Subscriber(payload)` handle that owns one `Subject(Message(payload))` and can join/leave many topics: replace `pubsub.subscribe`/`pubsub.unsubscribe` with `pubsub.subscriber` plus `join`/`leave`, and pass that subscriber to `pubsub.selecting`. `beryl/bridge` now forwards to an `event.Sender` via `event.notify` — `bridge.start(to:, with:)` returns a `Result` and no longer takes a RegisteredChannel, socket id, or topic. Distributed broadcast semantics, sender exclusion, and subscriber counts are unchanged."
