package = "beryl"
kind = "Changed"
body = "BREAKING: PubSub now uses a typed Subscriber(payload) handle that can join or leave many topics while keeping raw-mailbox recovery inside the library. Replace pubsub.subscribe/pubsub.unsubscribe with pubsub.subscriber plus join/leave, and pass that subscriber to pubsub.selecting. beryl/bridge is decoupled from channels and forwards to a socket.Sender via socket.notify: bridge.start(to:, with:) returns a Result and no longer takes a RegisteredChannel, socket id, or topic. Sender exclusion and subscriber counts are unchanged."
