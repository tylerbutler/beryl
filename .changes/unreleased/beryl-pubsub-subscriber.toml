project = "beryl"
kind = "Changed"
body = "PubSub now uses a typed `Subscriber(payload)` handle that can join or leave many topics while preserving the frozen raw `Message(payload)` record sent between BEAM nodes: replace `pubsub.subscribe`/`pubsub.unsubscribe` with `pubsub.subscriber` plus `join`/`leave`, and pass that subscriber to `pubsub.selecting`, which keeps raw-mailbox recovery inside the library. `beryl/bridge` is decoupled from channels and now forwards to an `event.Sender` via `event.notify` — `bridge.start(to:, with:)` returns a `Result` and no longer takes a RegisteredChannel, socket id, or topic. Distributed broadcast shape and semantics, sender exclusion, and subscriber counts are unchanged."
