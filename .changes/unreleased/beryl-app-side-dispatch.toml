project = "beryl"
kind = "Added"
body = "App-side dispatch API: beryl.child_spec(config, init, update) returns a Sockets handle and OTP child specification that route every socket event through one app-supplied update function via beryl/event (Event/Next/Effect), with typed Sender/notify for server-initiated messages, per-topic-pattern rate limits via with_topic_rate, and presence effects via with_presence_handle. Single-use, topic-scoped reply refs correlate join/message replies without cross-topic reuse."
