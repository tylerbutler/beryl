project = "beryl"
kind = "Added"
body = "App-side dispatch API: beryl.start(config, init, update) -> Result(Sockets, StartError) and embeddable beryl.child_spec(config, init, update) -> Result(#(Sockets, ChildSpecification(_)), ConfigError) route every socket event through one app-supplied update function via beryl/socket (Input/Next/Effect), with typed Sender/notify for server-initiated messages, per-topic-pattern rate limits via with_topic_rate, and presence effects (PresenceTrack/PresenceUntrack, apply-time PushPresence/BroadcastPresence) via with_presence_handle. Single-use, topic-scoped reply refs (socket.Ref) correlate join/message replies without cross-topic reuse."
